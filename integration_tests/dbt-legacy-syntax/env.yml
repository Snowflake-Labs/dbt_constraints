# Environment variables for dbt Projects on Snowflake.
#
# Snowflake resolves this file before the dbt run starts, then injects the results as
# environment variables. dbt_projects_profiles.yml reads them. Standard dbt ignores this
# file, so it does not affect the local test cells.
#
# Every key must be UPPERCASE with a DBT_ prefix. Snowflake rejects any other name.
#
# No matrix cell deploys this project today. Both in-database cells run dbt 1.10.5 or
# later, so they parse dbt-current-syntax. This file lets a dpos_core run use an older
# dbt Core that needs this project. It writes to its own schema, so it does not collide
# with the local cells, which write to dbt_constraints_test.

env_config:
  default_environment: dpos_core
  environments:
    - name: dpos_core
      env:
        # Resolve from the session that runs EXECUTE DBT PROJECT. The run then uses the
        # role and warehouse of the caller, with no account-specific name in this repo.
        DBT_CURRENT_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_CURRENT_DB: "{{ select CURRENT_DATABASE() }}"
        DBT_CURRENT_WH: "{{ select CURRENT_WAREHOUSE() }}"
        DBT_CURRENT_SCHEMA: "dbt_constraints_dpos_core"
